databaseChangeLog:
  - changeSet:
      id: 002-create-address-table
      author: santosediego
      changes:
        - createTable:
            tableName: tb_address
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tb_address
                    nullable: false
              - column:
                  name: street
                  type: VARCHAR(150)
              - column:
                  name: street_number
                  type: VARCHAR(10)
              - column:
                  name: complement
                  type: VARCHAR(100)
              - column:
                  name: neighborhood
                  type: VARCHAR(80)
              - column:
                  name: zip_code
                  type: VARCHAR(8)
              - column:
                  name: city
                  type: VARCHAR(100)
              - column:
                  name: state
                  type: VARCHAR(2)
              - column:
                  name: donor_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tb_address_donor_id
                    foreignKeyName: fk_tb_address_donor
                    referencedTableName: tb_donor
                    referencedColumnNames: id
                    deleteCascade: true
