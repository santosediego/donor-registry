databaseChangeLog:
  # No context: this table exists in every profile, prod included. It is never seeded.
  - changeSet:
      id: 005-create-user-account-table
      author: santosediego
      changes:
        - createTable:
            tableName: tb_user_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tb_user_account
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tb_user_account_username
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              # Single administrator: this column can only hold 1 (check below) and is unique,
              # so the table accepts at most one row, even with concurrent inserts.
              # NOT NULL is required: a NULL passes the check and does not collide in the unique index.
              # Not mapped in the entity: the database default fills it.
              - column:
                  name: singleton
                  type: SMALLINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tb_user_account_singleton
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
        # Plain SQL on purpose: Liquibase silently ignores the "checkConstraint" column attribute.
        - sql:
            sql: ALTER TABLE tb_user_account ADD CONSTRAINT ck_tb_user_account_singleton CHECK (singleton = 1)
        - sql:
            sql: ALTER TABLE tb_user_account ADD CONSTRAINT ck_tb_user_account_username_lower CHECK (username = LOWER(username))
