# In-memory H2 emulating PostgreSQL. Used by tests and by demo runs (APP_PROFILE=test).
spring.datasource.url=jdbc:h2:mem:donor_registry_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.contexts=test

# H2 console enabled ONLY in this profile
spring.h2.console.enabled=true
