# PostgreSQL local. No defaults: values come from environment variables (see backend/.env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.liquibase.contexts=dev

# PostgreSQL driver: keep column values (CPF, password hash, username) out of exception messages and logs
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
